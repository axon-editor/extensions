<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake</title>
    <link rel="stylesheet" href="styles/game.css" />
  </head>
  <body>
    <main class="shell">
      <div class="hud">
        <div class="hud-row">
          <div class="score">
            <span class="label">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="score">
            <span class="label">Best</span>
            <span id="best" class="value">0</span>
          </div>
          <div class="legend" title="Bonus apples are worth 5 points and expire after a few seconds.">
            <span class="gold-dot" aria-hidden="true"></span>
            <span class="label">bonus +5</span>
          </div>
        </div>
        <div class="hint">
          <kbd>&#8592;</kbd><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8594;</kbd>
          <span class="sep">/</span>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          <span class="sep">&middot;</span>
          <kbd>Space</kbd>
          <span>start &amp; pause</span>
        </div>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>
        <div id="overlay" class="overlay">
          <p class="title">Snake</p>
          <p id="message" class="message"></p>
          <button id="start" type="button">Play</button>
        </div>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
